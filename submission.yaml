submission:
  title: "FLEETIQ"                     # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Logistics and supply chain operations teams face cascading disruptions from port
    congestion, severe weather, road closures, carrier outages, and geopolitical events
    that delay shipments, strand idle fleet assets, and trigger undetected cold-chain
    temperature excursions — with no unified tool to identify impact, recommend
    alternatives, and prioritise action in real time.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    FLEETIQ is an AI-powered supply chain disruption and fleet utilisation assistant
    that automatically identifies affected shipments, recommends rerouting and
    alternative carriers with trade-off analysis, detects idle fleet vehicles for
    redeployment, severity-ranks cold-chain temperature excursions, and delivers an
    IBM Granite-generated operational briefing — all queryable through IBM Bob via
    natural language.

  key_features:                        # REQUIRED — List 3 to 5 specific features
    - "Disruption detection and affected shipment impact scoring across port congestion, severe weather, road closures, carrier outages, and geopolitical events"
    - "Rerouting and alternative carrier recommendations with estimated delay, cost delta, and trade-off explanation per shipment"
    - "Idle fleet detection and redeployment scoring using Haversine proximity, capacity matching, and vehicle-type suitability"
    - "Cold-chain temperature excursion severity ranking by deviation magnitude and duration, with critical/severe/moderate/minor classification"
    - "AI-generated operational summary and prioritised action items via IBM watsonx.ai Granite model, fully queryable through IBM Bob MCP tools"

  tech_stack:
    languages: ["Python", "JavaScript"]          # REQUIRED
    frameworks: ["FastAPI", "React", "SQLAlchemy", "Vite", "TailwindCSS"]
    ibm_technologies: ["watsonx.ai", "IBM Bob", "IBM Granite"]
    databases: ["SQLite"]
    other: ["Recharts", "Zustand", "pytest", "GitHub Actions", "Axios"]

  what_we_are_most_proud_of: >         # Optional but recommended
    The multi-domain AI fusion — five independent scoring algorithms (disruption,
    impact, routing, fleet, cold-chain) all feeding a single IBM Granite-powered
    operational briefing, with every data domain queryable through natural language
    via the IBM Bob MCP server integration.

  known_limitations: >                 # Optional but recommended
    Demo uses deterministic seeded data rather than live external feeds. A valid
    IBM watsonx.ai API key and Project ID are required for the AI summary feature;
    a graceful fallback message is shown if credentials are absent. Application is
    not deployed to a public URL and runs locally.

